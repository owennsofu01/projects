name: bible_gamehive
description: "Bible GameHive — free Bible trivia, quiz, and puzzle mini-games."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.5
  firebase_messaging: ^16.0.5
  firebase_crashlytics: ^5.0.5
  firebase_analytics: ^12.0.5

  # Auth providers
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1

  # Offline-first local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.1

  # UI / polish
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Audio (wired, no bundled narration assets yet)
  just_audio: ^0.9.42

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font.
